<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光态 J-V 曲线拟合 - 双二极管模型</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>光态 J-V 曲线拟合</h1>
            <p class="subtitle">Double Diode Model Fitting Tool</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <section class="card">
                    <h2>1. 导入数据</h2>
                    <input type="file" id="csvFile" accept=".csv,text/csv">
                    <label for="csvFile" class="btn-upload">选择 CSV 文件</label>
                    <div class="sample-actions">
                        <button type="button" class="btn-ghost" data-sample="nbg">NBG 示例</button>
                        <button type="button" class="btn-ghost" data-sample="wbg">WBG 示例</button>
                    </div>
                    <p id="fileName" class="file-name">未选择文件</p>
                    <div id="statusBox" class="status-box" role="status">等待导入数据</div>
                </section>

                <section class="card">
                    <h2>2. 参数设置</h2>
                    <div id="paramContainer" class="params-grid"></div>
                </section>

                <section class="card">
                    <h2>3. 拟合策略</h2>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useGlobal">
                        <span>扩展搜索</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useNelder">
                        <span>Nelder-Mead 精修</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="useLog">
                        <span>对数空间候选</span>
                    </label>
                    <div class="analysis-inputs">
                        <label class="analysis-input">
                            <span>自主迭代次数</span>
                            <input type="number" id="iterationCount" min="1" max="50" step="1" value="10">
                        </label>
                        <label class="analysis-input">
                            <span>Pin (mW/cm²)</span>
                            <input type="number" id="pinInput" min="0.000001" max="1000000" step="any" value="100">
                        </label>
                    </div>
                    <div class="fit-actions">
                        <button id="fitBtn" class="btn-primary">开始拟合</button>
                        <button id="cancelFitBtn" class="btn-danger hidden">取消拟合</button>
                    </div>
                    <div id="progress" class="progress-bar hidden" aria-label="拟合进度">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <p id="progressText" class="progress-text hidden"></p>
                </section>

                <section class="card">
                    <h2>4. 结果与诊断</h2>
                    <div id="qualityBox" class="quality-box hidden"></div>
                    <div id="resultContainer" class="result-box">等待导入数据...</div>
                    <div class="btn-group">
                        <button id="exportParams" class="btn-secondary" disabled>导出诊断</button>
                        <button id="exportCSV" class="btn-secondary" disabled>导出 CSV</button>
                    </div>
                </section>
            </aside>

            <main class="content-area">
                <section class="metrics-strip" aria-label="拟合摘要">
                    <div class="metric"><span>RMSE</span><strong id="metricRmse">--</strong></div>
                    <div class="metric"><span>Jsc (V≈0)</span><strong id="metricJsc">--</strong></div>
                    <div class="metric"><span>Voc</span><strong id="metricVoc">--</strong></div>
                    <div class="metric"><span>Vmp</span><strong id="metricVmp">--</strong></div>
                    <div class="metric"><span>Jmp</span><strong id="metricJmp">--</strong></div>
                    <div class="metric"><span>Pmax</span><strong id="metricPmax">--</strong></div>
                    <div class="metric"><span>PCE</span><strong id="metricPce">--</strong></div>
                    <div class="metric"><span>FF</span><strong id="metricFf">--</strong></div>
                    <div class="metric"><span>质量</span><strong id="metricMode">--</strong></div>
                </section>
                <div class="chart-container">
                    <canvas id="jvChart"></canvas>
                </div>
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
